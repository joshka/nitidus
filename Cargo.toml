[package]
name = "nitidus"
authors = ["Joshka"]
description = "A TUI email client built on Himalaya"
repository = "https://github.com/joshka/nitidus"
license = "MIT"
documentation = "https://docs.rs/nitidus"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
himalaya = "3.0.0"
html2text = "0.17"
io-pimdir = { version = "1.0.0", default-features = false, features = ["client", "mail"] }
itertools = "0.15"
pimalaya-cli = { version = "0.8.1", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppress with #[expect(lint, reason = "...")], never #[allow].
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Short functions that read as the algorithm (threshold in clippy.toml).
cognitive_complexity = "warn"
# foo.rs with foo/, never mod.rs.
mod_module_files = "warn"
# Private items get docs too.
missing_docs_in_private_items = "warn"
# No unwrap outside tests; errors keep their cause.
unwrap_used = "warn"
get_unwrap = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
# Adding an enum variant must reach every match on it.
wildcard_enum_match_arm = "warn"
dbg_macro = "warn"
# The terminal belongs to the UI; only `main` may print (the demo's config path).
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[dev-dependencies]
indoc = "2"
insta = { version = "1", features = ["filters"] }
rstest = "0.29"
