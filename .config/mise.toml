# Tools the justfile needs: https://mise.jdx.dev/
# Builds use stable Rust; only rustfmt needs nightly for its unstable options.

[tools]
rust = [
  { version = "stable", components = "clippy,rustfmt" },
  { version = "nightly", components = "rustfmt" },
]
"aqua:EmbarkStudios/cargo-deny" = "0.21"
"aqua:casey/just" = "1.59"
"aqua:crate-ci/typos" = "1.52"
"aqua:rvben/rumdl" = "0.3"
"github:bnjbvr/cargo-machete" = "0.10"
"github:nextest-rs/nextest" = { version = "cargo-nextest-0.9.152", bin = "cargo-nextest" }
