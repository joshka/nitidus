# Configuration for https://github.com/EmbarkStudios/cargo-deny

[advisories]
yanked = "deny"
ignore = [
  # chrono is flagged unmaintained. himalaya depends on it too, so dropping it here alone gains
  # nothing; revisit when himalaya moves (likely to jiff).
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; himalaya still uses chrono" },
]

[licenses]
# Permissive licenses that something needs. docs/conventions/dependencies.md says which to ask about.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # The Mozilla CA bundle that rustls-platform-verifier ships, a permissive data license.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # option-ext, through dirs, which himalaya uses for config paths. File-level copyleft: it covers
  # option-ext's own files, not nitidus, and an unmodified dependency asks nothing of us.
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# ring's license file holds its own ISC terms and BoringSSL's OpenSSL-derived ones, which
# cargo-deny can't read on its own.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
